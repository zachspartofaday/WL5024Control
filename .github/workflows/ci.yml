name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and package tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tool
        run: npm install --global xcodebuildmcp@2.7.0
      - name: Record toolchain
        run: |
          xcodebuildmcp --version
          xcodebuild -version
          swift --version
      - name: Build app without signing
        run: >-
          xcodebuildmcp macos build
          --workspace-path WL5024Control.xcworkspace
          --scheme WL5024Control
          --configuration Release
          --arch arm64
          --json '{"extraArgs":["CODE_SIGNING_ALLOWED=NO"]}'
      - name: Show compiler diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          root = Path.home() / "Library/Developer/XcodeBuildMCP"
          logs = sorted(root.glob("**/logs/build_macos_*.log"))
          if not logs:
              print("No XcodeBuildMCP build log was retained.")
          for log in logs:
              print(f"Compiler diagnostics: {log}")
              matches = [line for line in log.read_text(errors="replace").splitlines()
                         if re.search(r"(?:fatal )?error:|warning:", line)]
              print("\n".join(matches) if matches else "No compiler error or warning lines found.")
          PYTHON
      - name: Test Swift package
        if: ${{ !cancelled() }}
        run: xcodebuildmcp swift-package test --package-path WL5024ControlPackage
      - name: Build Release package
        if: ${{ !cancelled() }}
        run: xcodebuildmcp swift-package build --package-path WL5024ControlPackage --configuration release
